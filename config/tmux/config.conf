# Colour — Claude Code's UI looks wrong without truecolour
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Key handling — Esc lag and multiline input are the two big ones
set -s escape-time 0
set -s extended-keys on
set -as terminal-features ",*:extkeys"

# Let apps talk to the outer terminal (OSC sequences, images, notifications)
set -g allow-passthrough on
set -g set-clipboard on
set -g focus-events on

# Mouse: scroll, pane select, resize
set -g mouse on

# Scrollback
set -g history-limit 100000

# Bell — Claude Code rings when a long task finishes
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off

# Don't let a phone attaching shrink your desktop window
setw -g aggressive-resize on

# Quality of life
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename off
set -g status-right ''

